<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aveera Travel - Contact</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <header>

        <nav class="fixed top-0 left-0 z-50 flex h-16 w-full items-center justify-between border-b bg-white px-8">

            <!-- Logo -->

            <div class="flex items-center">
                <div class="flex items-center space-x-1">

                    <img class="h-10 w-10"
                        src="./Images/logo.jpg"
                        alt="Averra logo">

                    <h2 class="text-gray-900">
                       <a style ="text-decoration: none;"href="index.html">AVERRA</a>
                    </h2>

                </div>
            </div>


            <!-- Menu -->

            <div class="flex items-center space-x-6 text-base">

                <a href="#"
                    class="rounded-full p-2 text-gray-900 no-underline hover:bg-gray-100">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Plan with AI

                </a>


                <a href="discover.html"
                    class="rounded-full p-2 text-gray-900 no-underline hover:bg-gray-100">

                    Discover

                </a>


                <a href="food.html"
                    class="rounded-full p-2 text-gray-900 no-underline hover:bg-gray-100">

                    Food

                </a>


                <a href="contact.html"
                    class="rounded-full p-2 text-gray-900 no-underline hover:bg-gray-100">

                    More

                </a>

            </div>

        </nav>

    </header>


    <!-- Contact Section -->

    <section class="px-4 py-12 pt-24 md:px-6">

        <div class="mx-auto max-w-xl">


            <!-- Heading -->

            <div class="mb-10">

                <h2 class="mb-4 text-3xl font-bold text-gray-900 md:text-4xl">

                    Contact Us

                </h2>


                <p class="text-base leading-relaxed text-gray-600">

                    🌍 Have a question about your next trip?
                    We'd love to hear from you.

                </p>

            </div>


            <!-- Contact Form -->

            <form class="space-y-6">


                <!-- Name -->

                <div>

                    <label for="name"
                        class="mb-2 inline-block text-sm font-medium text-gray-900">

                        Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        class="w-full rounded-md border border-gray-400 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500">

                </div>


                <!-- Email -->

                <div>

                    <label for="email"
                        class="mb-2 inline-block text-sm font-medium text-gray-900">

                        Email

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        class="w-full rounded-md border border-gray-400 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500">

                </div>


                <!-- Phone -->

                <div>

                    <label for="phone"
                        class="mb-2 inline-block text-sm font-medium text-gray-900">

                        Phone Number

                    </label>


                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+91 XXXXX XXXXX"
                        class="w-full rounded-md border border-gray-400 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500">

                </div>


                <!-- Message -->

                <div>

                    <label for="message"
                        class="mb-2 inline-block text-sm font-medium text-gray-900">

                        Message

                    </label>


                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        class="w-full rounded-md border border-gray-400 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="cursor-pointer rounded-md bg-green-600 px-5 py-2 text-sm font-semibold text-white transition-all hover:bg-green-700">

                    Send Message

                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <section class="mt-10 bg-gray-100 p-10">

        <h1 class="p-2 text-3xl font-bold">

            Aveera Travel

        </h1>


        <p class="p-2 text-gray-600">

            Discover new places, explore beautiful destinations,
            and create unforgettable travel memories.

        </p>


        <p class="p-2 text-gray-500">

            © 2026 Aveera Travel. All rights reserved.

        </p>

    </section>


</body>

</html>
